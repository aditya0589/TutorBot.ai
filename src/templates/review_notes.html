<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Notes - TutorBot.ai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .review-container {
            padding-top: 80px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }

        .review-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .review-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .review-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .filter-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-section select, .filter-section input {
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .filter-section select:focus, .filter-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-section button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            display: grid;
            gap: 1.5rem;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .note-subject {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
        }

        .note-content {
            color: #b8b8b8;
            line-height: 1.6;
        }

        .note-time {
            font-size: 0.9rem;
            color: #888;
        }

        @media (max-width: 768px) {
            .filter-section {
                flex-direction: column;
            }

            .notes-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">🧠 TutorBot.ai</div>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}">Home</a>
                <a href="{{ url_for('quiz_analytics') }}">Dashboard</a>
                <a href="{{ url_for('subjects') }}">Subjects</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="review-container">
        <div class="review-header">
            <div class="container">
                <h1>📝 Review Your Notes</h1>
                <p>Explore and filter all your saved notes</p>
            </div>
        </div>

        <div class="review-content">
            <div class="filter-section">
                <select name="subject" id="subjectFilter">
                    <option value="">All Subjects</option>
                    <option value="dsa">Data Structures & Algorithms</option>
                    <option value="ml">Machine Learning</option>
                    <option value="dbms">Database Management Systems</option>
                    <option value="os">Operating Systems</option>
                    <option value="webdev">Web Development</option>
                    <option value="networks">Computer Networks</option>
                </select>
                <input type="date" name="dateFilter" id="dateFilter">
                <button onclick="applyFilters()">Apply Filters</button>
            </div>

            <div class="notes-list" id="notesList">
                {% for note in notes %}
                    <div class="note-card">
                        <div class="note-subject">{{ note[1] }}</div>
                        <div class="note-content">{{ note[2]|safe }}</div>
                        <div class="note-time">Saved on: {{ note[3].strftime('%Y-%m-%d %H:%M') }}</div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        function applyFilters() {
            const subject = document.getElementById('subjectFilter').value;
            const date = document.getElementById('dateFilter').value;
            console.log('Applying filters:', { subject, date }); // Debug log

            fetch(`/review_notes?subject=${encodeURIComponent(subject)}&date=${encodeURIComponent(date)}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest', // Explicitly set to mimic AJAX
                },
                credentials: 'same-origin', // Include cookies for session
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(`HTTP error! Status: ${response.status}, Body: ${text.substring(0, 100)}...`); });
                }
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data); // Debug log
                const notesList = document.getElementById('notesList');
                notesList.innerHTML = ''; // Clear existing notes
                if (data.notes && Array.isArray(data.notes) && data.notes.length > 0) {
                    data.notes.forEach(note => {
                        const noteCard = document.createElement('div');
                        noteCard.className = 'note-card';
                        noteCard.innerHTML = `
                            <div class="note-subject">${note.subject || 'N/A'}</div>
                            <div class="note-content">${note.note_content || 'No content'}</div>
                            <div class="note-time">Saved on: ${note.created_at ? new Date(note.created_at).toLocaleString() : 'N/A'}</div>
                        `;
                        notesList.appendChild(noteCard);
                    });
                } else {
                    notesList.innerHTML = '<div class="note-card">No notes found.</div>'; // Fallback message
                }
            })
            .catch(error => {
                console.error('Error applying filters:', error); // Detailed error log
                const notesList = document.getElementById('notesList');
                notesList.innerHTML = `<div class="note-card">Error loading notes: ${error.message}. Check console for details.</div>`;
            });

            return false; // Prevent default form submission if inside a form
        }

        // Add scroll effect to navbar
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(15, 15, 35, 0.98)';
            } else {
                navbar.style.background = 'rgba(15, 15, 35, 0.95)';
            }
        });
    </script>
</body>
</html>
