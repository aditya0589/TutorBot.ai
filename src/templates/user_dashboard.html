<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">🧠 TutorBot.ai</div>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="/user_dashboard">Dashboard</a>
                <a href="#subjects">Subjects</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    <div class="dashboard-container">
        <br>
        <h1 style="text-align: center; color: white;">Welcome to Your Dashboard</h1>
        <p style="text-align: center; color: white;">Track your learning progress and performance over time.</p>
        <br><br>
        <!-- Embed Plotly Graph -->
        {{ sub_bar | safe }}
        <br>
        <br>
        {{ sub_line | safe }}
    </div>
    <script>
        // Add scroll effect to navbar
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(15, 15, 35, 0.98)';
            } else {
                navbar.style.background = 'rgba(15, 15, 35, 0.95)';
            }
        });
    </script>
</body>
</html>
