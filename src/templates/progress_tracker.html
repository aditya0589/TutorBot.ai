<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker - TutorBot.ai</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .main-content {
            margin-top: 80px; /* Space for fixed navbar */
            padding: 20px;
            color: white;
        }
        .subject {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: black;
            color: white;
        }
        .subject h3 {
            margin: 0 0 15px 0;
            color: white;
            font-size: 18px;
        }
        .topics {
            display: block; /* Always show topics */
            color: white;
        }
        .topics label {
            display: block;
            margin: 8px 0;
            padding: 8px;
            background: black;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .topics label:hover {
            background: black;
            color: white;
        }
        .topics input[type="checkbox"] {
            margin-right: 10px;
        }
        h2 {
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🧠 TutorBot.ai</div>
            <div class="nav-links">
                <a href="/home">Home</a>
                <a href="#dashboard">Dashboard</a>
                <a href="#subjects">Subjects</a>
                <a href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Progress Tracker -->
    <div class="main-content">
        <h2>Progress Tracker</h2>
        {% for subject in subjects %}
            <div class="subject">
                <h3>{{ subject.sub_name }}</h3>
                <div class="topics">
                    {% for topic in subject.topics %}
                        <label>
                            <input type="checkbox" name="topics" value="{{ topic[0] }}">
                            {{ topic[1] }}
                        </label>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>

    <script>
        // Add scroll effect to navbar
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(15, 15, 35, 0.98)';
            } else {
                navbar.style.background = 'rgba(15, 15, 35, 0.95)';
            }
        });
    </script>
</body>
</html>
